exchange:
  name: binance
  market: futures

scan:
  intervals:
    - 5m
  symbols:
    - ETHUSDT
    - BTCUSDT
    - SOLUSDT
    - BNBUSDT
    - DOGEUSDT
    - XRPUSDT
  ohlcv_limit: 150
  loop_seconds: 60
  use_closed_candle_only: true

strategy:
  name: macd_rebound
  lookback_drop_bars: 48
  min_drop_pct: 1.5
  low_check_bars: 12
  low_break_tolerance_pct: 0.2

  macd:
    fast: 12
    slow: 26
    signal: 9
    shrink_bars: 3

  ma:
    short: 7
    mid: 25
    long: 99
    require_above_ma7: true
    require_above_ma25: true
    require_above_ma99: false

  volume:
    ma_bars: 5
    multiplier: 1.3

alert:
  provider: feishu
  cooldown_minutes: 30
  webhook_url_env: FEISHU_WEBHOOK_URL
  secret_env: FEISHU_SECRET

paths:
  state_file: data/alert_state.json
  signals_csv: data/signals.csv
  log_file: logs/macd_rebound_scanner.log
